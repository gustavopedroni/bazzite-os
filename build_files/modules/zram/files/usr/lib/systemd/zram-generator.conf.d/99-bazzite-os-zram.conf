# Complementa o /etc/systemd/zram-generator.conf do Bazzite: drop-in em conf.d/
# vence o arquivo principal so nas chaves que define. O algoritmo (zstd) segue
# o do Bazzite; aqui muda so o tamanho, de min(ram / 2, 16384) para ram.
# `ram` e o MemTotal lido a cada boot: o tamanho acompanha a maquina.
# Ligar/desligar: bazzite-os-zram on|off.
[zram0]
# Tamanho antes da compressao, nao RAM reservada. Com zstd (~3:1) ocupa no
# maximo ~1/3 da RAM quando cheio.
zram-size = ram
