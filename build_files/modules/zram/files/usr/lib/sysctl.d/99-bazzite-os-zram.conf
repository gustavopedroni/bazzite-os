# Tuning para swap em zram, o mesmo do Bazzite Deck (65-memory.conf), que o
# desktop nao traz. Ligar/desligar: bazzite-os-zram on|off.
# Acima de 100: swap em zram e mais barato que reler arquivo do disco.
vm.swappiness = 180
# Le 1 pagina do swap por vez em vez de 8: menos latencia (jogos).
vm.page-cluster = 0
# Comeca a liberar memoria com 1,25% livre em vez de 0,1%.
vm.watermark_scale_factor = 125
# Sem boost de reclaim por fragmentacao: com o scale em 125 cada boost
# liberaria ~1,5x a margem de uma vez, em picos de compressao.
vm.watermark_boost_factor = 0

# Escrita pendente em disco, tambem do Deck. O padrao do kernel (20%/10% da
# memoria disponivel, ~6 GB/~3 GB com 32 GB) leva ~1 min para escoar num HD e
# trava quem escreve nesse meio-tempo (copias grandes, update de jogo). Num
# NVMe 256 MB escoam em menos de 1 s. Definir *_bytes zera o *_ratio.
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 134217728
