# O RPM do docker-ce cria o grupo via %pre, o que so atinge o /etc/group da
# imagem. No sistema instalado o /etc/group ja foi alterado (usuario criado),
# entao o merge do /etc mantem a versao local e o grupo nao chega; sem ele o
# docker.socket (SocketGroup=docker) falha. O systemd-sysusers cria no boot.
g docker -
