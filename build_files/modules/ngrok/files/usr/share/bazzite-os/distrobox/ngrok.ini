# distrobox assemble: criado por usuario pelo bazzite-os-ngrok-box.service.
# ngrok do repo apt oficial (ngrok.com/download). O init_hooks roda a cada start
# do box, por isso o `command -v` na frente. Atualizar:
# `distrobox enter ngrok -- sudo apt upgrade`.
[ngrok]
image=quay.io/toolbx/ubuntu-toolbox:24.04
pull=true
start_now=true
init_hooks="command -v ngrok >/dev/null || { curl -fsSL https://ngrok-agent.s3.amazonaws.com/ngrok.asc > /etc/apt/trusted.gpg.d/ngrok.asc && echo 'deb https://ngrok-agent.s3.amazonaws.com bookworm main' > /etc/apt/sources.list.d/ngrok.list && apt-get update && apt-get install -y ngrok; }"
# Vira ~/.local/bin/ngrok no host (ja no PATH pelo .zprofile).
exported_bins=/usr/bin/ngrok
