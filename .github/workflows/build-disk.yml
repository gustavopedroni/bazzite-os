---
name: Build live ISO

on:
  workflow_dispatch:
    inputs:
      upload-to-s3:
        description: "Upload to S3"
        required: false
        default: false
        type: boolean
  pull_request:
    branches:
      - main
    paths:
      - 'installer/**'
      - 'build_files/modules/flatpaks/**'
      - '.github/workflows/build-disk.yml'

env:
  IMAGE_NAME: ${{ github.event.repository.name }} # output of build.yml, keep in sync
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  DEFAULT_TAG: "latest"
  # Sessao live: bazzite KDE SEM nvidia, exatamente a base que o ublue-os/bazzite
  # usa na ISO do bazzite-nvidia-open. O driver proprietario nao funciona bem numa
  # sessao live, entao a live roda nouveau e so a instalacao leva o nvidia-open.
  LIVE_BASE_IMAGE: "ghcr.io/ublue-os/bazzite:stable"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build live ISO
    # amd64 apenas: ghcr.io/ublue-os/bazzite nao publica manifest arm64, entao nao
    # existe sessao live pra montar em arm.
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          extra-squeeze: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Keep bwrap children in the parent AppArmor profile (Ubuntu 26.04)
        # O 26.04 traz o perfil bwrap-userns-restrict. Ele casa com /usr/bin/bwrap
        # por path, tambem dentro de um container podman privilegiado, e move tudo
        # que o bwrap inicia pro perfil "unpriv_bwrap", sem capabilities. Aqui isso
        # quebraria o `flatpak install` do installer/build.sh (flatpak roda sob
        # bwrap) e os mounts do titanoboa. Pelo include local que o perfil
        # empacotado ja suporta, os filhos ficam em "bwrap (enforce)". AppArmor
        # segue ligado e os dois perfis empacotados seguem carregados. No-op onde o
        # perfil nao existe.
        run: |
          if sudo test -r /etc/apparmor.d/bwrap-userns-restrict &&
             sudo test -r /sys/kernel/security/apparmor/profiles &&
             sudo grep -qx 'bwrap (enforce)' /sys/kernel/security/apparmor/profiles; then
            printf '%s\n' 'priority=100 allow file rwlkm /**,' 'priority=100 allow ix /**,' \
              | sudo tee /etc/apparmor.d/local/bwrap-userns-restrict >/dev/null
            sudo apparmor_parser -Q /etc/apparmor.d/bwrap-userns-restrict
            sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
            echo "bwrap AppArmor override installed"
          else
            echo "bwrap-userns-restrict not enforced on this runner, nothing to do"
          fi

      - name: Mount container storage on a BTRFS loopback
        # A sessao live descomprimida (~14 GB), a imagem instalada que vai embutida
        # (~15 GB) e os flatpaks nao cabem no storage do runner sem compressao.
        # Mesmo bloco do build_iso.yml do ublue-os/bazzite.
        run: |
          sudo truncate -s 110G /mnt/podman-storage.img
          sudo mkfs.btrfs -f -m single -d single /mnt/podman-storage.img
          sudo podman system reset --force
          sudo systemctl stop podman.service
          LOOP=$(sudo losetup --find --show --direct-io=on /mnt/podman-storage.img)
          sudo mkdir -p /mnt/podman-storage
          sudo mount -o compress-force=zstd:2,discard=async,noatime "$LOOP" /mnt/podman-storage
          sudo mkdir -p /mnt/podman-storage/storage /mnt/podman-storage/tmp
          sudo mount --bind /mnt/podman-storage/storage /var/lib/containers/storage
          sudo systemctl start podman.service

      - name: Generate the ISO flatpak list
        # Fonte unica: a mesma lista que a imagem usa em preinstall.d. O
        # install-flatpaks.ks do installer copia esses flatpaks da ISO pro disco,
        # entao instalacao sem rede ja sai com os apps.
        env:
          PREINSTALL: build_files/modules/flatpaks/files/usr/share/flatpak/preinstall.d/bazzite-os.preinstall
        run: |
          {
            echo "# GERADO pelo workflow a partir de ${PREINSTALL}"
            echo "# Nao editar a mao: edite o .preinstall, que e a fonte unica."
            sed -n 's/^\[Flatpak Preinstall \(.*\)\]$/app\/\1\/x86_64\/stable/p' "${PREINSTALL}"
          } > installer/kde_flatpaks/flatpaks
          grep -c '^app/' installer/kde_flatpaks/flatpaks
          cat installer/kde_flatpaks/flatpaks

      - name: Build the live payload image
        # A imagem que sai daqui NAO e a que vai pro disco: e a sessao live que o
        # titanoboa transforma em squashfs. A imagem instalada entra dentro dela, no
        # storage do podman, e o kickstart do installer aponta pra ela.
        env:
          INSTALL_IMAGE_PAYLOAD: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}
        run: |
          sudo env TMPDIR=/mnt/podman-storage/tmp podman build \
            --cap-add sys_admin \
            --security-opt label=disable \
            --build-arg BASE_IMAGE="${LIVE_BASE_IMAGE}" \
            --build-arg INSTALL_IMAGE_PAYLOAD="${INSTALL_IMAGE_PAYLOAD}" \
            --build-arg FLATPAK_DIR_SHORTNAME=kde_flatpaks \
            -t localhost/payload:latest \
            installer/

      - name: Show disk space
        if: always()
        run: |
          sudo df -h
          sudo du -sh /mnt/podman-storage.img

      - name: Build ISO
        id: build
        # main do ublue-os/titanoboa. O ublue-os/bazzite ainda pina
        # Zeglius/titanoboa@revamp-pr, mas aquela branch parou em 2026-03 e o revamp
        # ja foi mergeado aqui ("feat!: Only use container images as the only source
        # of truth", #138, 2026-05).
        uses: ublue-os/titanoboa@5c457c3d0518bd17e754be0fd98a60d29d26abb4 # main
        with:
          image-ref: localhost/payload:latest

      - name: Rename ISO and generate checksum
        id: output
        env:
          ISO_SRC: ${{ steps.build.outputs.iso-dest }}
        run: |
          ISO_NAME="${IMAGE_NAME}-live-amd64.iso"
          mkdir -p output
          mv "${ISO_SRC}" "output/${ISO_NAME}"
          (cd output && sha256sum "${ISO_NAME}" | tee "${ISO_NAME}-CHECKSUM")
          echo "dir=output" >> "${GITHUB_OUTPUT}"

      - name: Upload ISO and Checksum to Job Artifacts
        if: inputs.upload-to-s3 != true && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.output.outputs.dir }}
          if-no-files-found: error
          retention-days: 0
          compression-level: 0
          overwrite: true

      - name: Upload to S3
        if: inputs.upload-to-s3 == true && github.event_name != 'pull_request'
        shell: bash
        env:
          RCLONE_CONFIG_S3_TYPE: s3
          RCLONE_CONFIG_S3_PROVIDER: ${{ secrets.S3_PROVIDER }}
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_S3_REGION: ${{ secrets.S3_REGION }}
          RCLONE_CONFIG_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          SOURCE_DIR: ${{ steps.output.outputs.dir }}
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
          # 64M de chunk: no default de 5M uma ISO de ~8 GB vira ~1600 partes.
          rclone copy --stats-one-line --s3-chunk-size 64M \
            "${SOURCE_DIR}" "S3:${S3_BUCKET_NAME}"
